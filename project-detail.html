<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G.R — Project Detail</title>
<style>
  :root{
    --bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;
    --text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;
    --green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;
    --radius:10px;--sidebar-w:220px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;}
  .sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s;}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
  .sidebar-logo .brand{font-size:17px;font-weight:700;}
  .sidebar-logo .tagline{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto;}
  .nav-section{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:14px 10px 6px;}
  .nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s;cursor:pointer;margin-bottom:2px;}
  .nav-link:hover{background:var(--surface2);color:var(--text);}
  .nav-link.active{background:var(--accent);color:#fff;}
  .sidebar-footer{padding:14px 8px;border-top:1px solid var(--border);}
  .user-pill{display:flex;align-items:center;gap:10px;padding:9px 10px;}
  .user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .user-info{flex:1;min-width:0;}
  .user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-role{font-size:11px;color:var(--muted);}
  .logout-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;transition:all .15s;}
  .logout-btn:hover{background:var(--surface2);color:var(--red);}

  /* Main layout */
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
  .menu-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px;border-radius:6px;}
  .back-link{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:5px 10px;border-radius:7px;border:1px solid var(--border);transition:all .15s;}
  .back-link:hover{background:var(--surface2);color:var(--text);}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .breadcrumb span{color:var(--text);font-weight:600;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .content{padding:24px;flex:1;max-width:900px;width:100%;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all .15s;text-decoration:none;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--accent-hover);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface2);color:var(--text);}
  .btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25);}
  .btn-danger:hover{background:rgba(239,68,68,.2);}
  .btn-success{background:#16a34a;color:#fff;}
  .btn-success:hover:not(:disabled){background:#15803d;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-sm{padding:5px 12px;font-size:12px;}

  /* Project header card */
  .project-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;}
  .ph-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;}
  .ph-icon{width:48px;height:48px;border-radius:10px;background:rgba(59,130,246,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ph-info{flex:1;}
  .ph-name{font-size:20px;font-weight:700;margin-bottom:4px;}
  .ph-client{font-size:14px;color:var(--muted);}
  .ph-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .ph-meta-item{display:flex;align-items:center;gap:5px;}

  /* Status stepper */
  .stepper{display:flex;align-items:center;gap:0;overflow-x:auto;padding:16px 0 4px;margin-bottom:4px;}
  .step-node{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:90px;}
  .step-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--surface);transition:all .2s;position:relative;z-index:1;}
  .step-label{font-size:10px;font-weight:500;color:var(--muted);text-align:center;line-height:1.3;}
  .step-node.done .step-dot{border-color:var(--green);background:var(--green);color:#fff;}
  .step-node.done .step-label{color:#4ade80;}
  .step-node.active .step-dot{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.2);}
  .step-node.active .step-label{color:#60a5fa;font-weight:700;}
  .step-node.rejected-state .step-dot{border-color:var(--red);background:var(--red);color:#fff;}
  .step-node.rejected-state .step-label{color:#f87171;}
  .step-line{flex:1;height:2px;background:var(--border);min-width:20px;margin-top:-16px;}
  .step-line.done{background:var(--green);}

  /* Tab nav */
  .tab-nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;}
  .tab-btn{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-count{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 6px;font-weight:600;}
  .tab-btn.active .tab-count{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#60a5fa;}

  /* Tab panels */
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* Form */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;}
  .card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:13px;font-weight:700;}
  .card-body{padding:20px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group.full{grid-column:1/-1;}
  .form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .form-control{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s;width:100%;}
  .form-control:focus{border-color:var(--accent);}
  .form-control::placeholder{color:var(--muted);}
  textarea.form-control{resize:vertical;min-height:90px;line-height:1.6;}
  .section-sep{grid-column:1/-1;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-top:4px;}
  .save-bar{display:flex;align-items:center;gap:10px;margin-top:20px;}

  /* Lead banner */
  .lead-banner{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .lead-banner a{color:#60a5fa;text-decoration:none;font-weight:600;}
  .lead-banner a:hover{text-decoration:underline;}

  /* Placeholder tab */
  .placeholder-tab{text-align:center;padding:60px 20px;}
  .placeholder-tab .icon-wrap{width:64px;height:64px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;opacity:.7;}
  .placeholder-tab h3{font-size:16px;font-weight:600;margin-bottom:6px;}
  .placeholder-tab p{font-size:13px;color:var(--muted);margin-bottom:24px;max-width:360px;margin-left:auto;margin-right:auto;line-height:1.6;}
  .coming-soon-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;margin-bottom:16px;}

  /* Status quick change */
  .status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status-select-wrap{display:flex;align-items:center;gap:8px;font-size:13px;}

  /* Badges */
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge-survey_pending{background:rgba(148,163,184,.12);color:var(--muted);border:1px solid rgba(148,163,184,.2);}
  .badge-survey_done   {background:rgba(59,130,246,.15);color:#60a5fa;}
  .badge-boq_draft     {background:rgba(234,179,8,.15);color:#facc15;}
  .badge-proposal_sent {background:rgba(168,85,247,.15);color:#c084fc;}
  .badge-accepted      {background:rgba(34,197,94,.15);color:#4ade80;}
  .badge-rejected      {background:rgba(239,68,68,.15);color:#f87171;}
  .badge-execution     {background:rgba(249,115,22,.15);color:#fb923c;}
  .badge-completed     {background:rgba(20,184,166,.15);color:#2dd4bf;}

  /* Delete confirm */
  .danger-zone{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .danger-zone-text{font-size:13px;color:var(--muted);}
  .danger-zone-text strong{color:#f87171;display:block;font-size:13px;margin-bottom:2px;}

  /* Toast & Spinner */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 18px;font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success{border-color:rgba(34,197,94,.4);color:#4ade80;}
  .toast.error{border-color:rgba(239,68,68,.4);color:#f87171;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* BOQ tab */
  .boq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .boq-card-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
  .boq-card-hd:hover{background:rgba(255,255,255,.03);}
  .boq-card-bd{padding:20px;border-top:1px solid var(--border);}
  .boq-card.collapsed .boq-card-bd{display:none;}
  .boq-arrow{color:var(--muted);transition:transform .2s;}
  .items-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;}
  .items-table th{padding:7px 8px;text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);}
  .items-table td{padding:3px 4px;vertical-align:middle;border-bottom:1px solid rgba(51,65,85,.4);}
  .items-table tr:last-child td{border-bottom:none;}
  .items-table input,.items-table select{background:var(--surface2);border:1px solid transparent;color:var(--text);border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit;width:100%;}
  .items-table input:focus,.items-table select:focus{outline:none;border-color:var(--accent);background:var(--bg);}
  .items-table .num-cell{text-align:right;font-size:12px;font-weight:600;padding-right:8px;white-space:nowrap;}
  .prod-ac{position:relative;}
  .prod-ac-dd{position:absolute;left:0;top:calc(100% + 2px);z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:260px;max-height:180px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;}
  .prod-ac-item{padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(51,65,85,.3);}
  .prod-ac-item:last-child{border-bottom:none;}
  .prod-ac-item:hover,.prod-ac-item.active{background:var(--surface2);}
  .prod-ac-name{font-weight:500;}
  .prod-ac-meta{font-size:11px;color:var(--muted);margin-top:1px;}
  .fin-panel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0;}
  .fin-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;}
  .fin-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:8px;font-weight:700;font-size:14px;}
  .fin-lbl{color:var(--muted);}
  .fin-val{font-weight:500;}
  .fin-row.total .fin-val{color:#60a5fa;font-size:15px;}
  .fin-disc-inp{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 8px;font-size:12px;font-family:inherit;width:90px;text-align:right;}
  .fin-disc-inp:focus{outline:none;border-color:var(--accent);}
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-bx{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:4px;}
  .modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .gen-opt{border:1.5px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;margin-bottom:10px;}
  .gen-opt:hover{border-color:var(--accent);background:rgba(59,130,246,.05);}
  .gen-opt-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .gen-opt-desc{font-size:12px;color:var(--muted);}
  .badge-bq-draft{background:rgba(148,163,184,.12);color:var(--muted);border:1px solid rgba(148,163,184,.2);}
  .badge-bq-review{background:rgba(234,179,8,.15);color:#facc15;}
  .badge-bq-approved{background:rgba(34,197,94,.15);color:#4ade80;}
  .badge-bq-rejected{background:rgba(239,68,68,.15);color:#f87171;}
  .ai-gen-anim{display:flex;gap:5px;align-items:center;justify-content:center;padding:20px;}
  @keyframes bq-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:bq-pulse 1.2s ease-in-out infinite;}
  .ai-dot:nth-child(2){animation-delay:.2s;}.ai-dot:nth-child(3){animation-delay:.4s;}

  /* Proposal tab */
  .prop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .prop-card-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;}
  .prop-card-bd{padding:20px;border-top:1px solid var(--border);}
  .prop-card.accepted{border-color:rgba(34,197,94,.3);}
  .prop-card.rejected{border-color:rgba(239,68,68,.3);}
  .prop-resp-group{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 14px;}
  .prop-resp-label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;}
  .prop-resp-label input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
  .badge-sent{background:rgba(168,85,247,.15);color:#c084fc;}
  .badge-accepted{background:rgba(34,197,94,.15);color:#4ade80;}
  .badge-rejected{background:rgba(239,68,68,.15);color:#f87171;}
  .badge-negotiating{background:rgba(234,179,8,.15);color:#facc15;}
  .zoho-link{display:inline-flex;align-items:center;gap:6px;color:#60a5fa;font-size:12px;text-decoration:none;padding:5px 10px;border:1px solid rgba(59,130,246,.3);border-radius:6px;transition:all .15s;}
  .zoho-link:hover{background:rgba(59,130,246,.1);}

  /* Survey tab */
  .sv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .sv-card-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
  .sv-card-hd:hover{background:rgba(255,255,255,.03);}
  .sv-card-bd{padding:20px;border-top:1px solid var(--border);}
  .sv-card.collapsed .sv-card-bd{display:none;}
  .sv-section{margin-bottom:20px;}
  .sv-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:10px;}
  .file-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface2);}
  .file-thumb img{width:100%;height:72px;object-fit:cover;display:block;cursor:zoom-in;}
  .ft-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1;}
  .file-doc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:72px;padding:6px;text-align:center;}
  .file-doc span{font-size:9px;color:var(--muted);word-break:break-all;line-height:1.2;}
  .file-upload-label{border:2px dashed var(--border);border-radius:8px;padding:9px 14px;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;transition:border-color .15s;display:inline-flex;align-items:center;gap:6px;}
  .file-upload-label:hover{border-color:var(--accent);color:var(--accent);}
  .meas-table{width:100%;border-collapse:collapse;font-size:13px;}
  .meas-table th{padding:6px 8px;text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);}
  .meas-table td{padding:4px 6px;vertical-align:middle;}
  .meas-table input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;width:100%;}
  .meas-table input:focus{outline:none;border-color:var(--accent);}

  /* Mobile overlay */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
  .overlay.open{display:block;}
  @media(max-width:768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.5);}
    .main{margin-left:0;}
    .menu-toggle{display:block;}
    .topbar{padding:10px 14px;}
    .content{padding:16px;}
    .form-grid{grid-template-columns:1fr;}
    .ph-meta{gap:12px;}
    .stepper{padding:12px 0 4px;}
    .step-node{min-width:70px;}
    .step-label{font-size:9px;}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="brand">A.G.R Automation</div><div class="tagline">BOQ Management System</div></div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>

<script>
const API = 'https://agr-boq-backend.agrayush98.workers.dev';

function getSession(){ return localStorage.getItem('sessionId'); }
function getUser(){ try{ return JSON.parse(localStorage.getItem('agr_user')||'null'); }catch{ return null; } }
function ah(){ return {'X-Session-ID':getSession()}; }
function jh(){ return {'Content-Type':'application/json','X-Session-ID':getSession()}; }
function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''; }
function fmt(n){ return n?'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}):'—'; }
function fmtDate(d){ return d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}):'—'; }
function daysActive(d){ return d?Math.floor((Date.now()-new Date(d))/86400000):0; }

function toast(msg,type='success'){ const el=document.getElementById('toast'); el.textContent=msg; el.className=`toast ${type} show`; setTimeout(()=>el.classList.remove('show'),3500); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mob-overlay').classList.toggle('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('mob-overlay').classList.remove('open'); }

const STATUS_LABELS={survey_pending:'Survey Pending',survey_done:'Survey Done',boq_draft:'BOQ Draft',proposal_sent:'Proposal Sent',accepted:'Accepted',rejected:'Rejected',execution:'In Execution',completed:'Completed'};
const STATUS_STEPS=['survey_pending','survey_done','boq_draft','proposal_sent','accepted','execution','completed'];
function statusBadge(s){ return `<span class="badge badge-${s}">${STATUS_LABELS[s]||s}</span>`; }

function renderStepper(currentStatus){
  if(currentStatus==='rejected'){
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0">
      <span class="badge badge-rejected" style="font-size:13px;padding:6px 14px">Rejected</span>
      <span style="font-size:12px;color:var(--muted)">This project was rejected.</span>
    </div>`;
  }
  const currentIdx = STATUS_STEPS.indexOf(currentStatus);
  let html='<div class="stepper">';
  STATUS_STEPS.forEach((s,i)=>{
    const isDone = i < currentIdx;
    const isActive = i === currentIdx;
    const cls = isDone?'done':isActive?'active':'';
    const icon = isDone
      ? `<svg width="12" height="12" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      : `${i+1}`;
    if(i>0) html+=`<div class="step-line${isDone?' done':''}"></div>`;
    html+=`<div class="step-node ${cls}"><div class="step-dot">${icon}</div><div class="step-label">${STATUS_LABELS[s]}</div></div>`;
  });
  html+='</div>';
  return html;
}

function renderPage(){

        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

    </div>

    <!-- Overview Tab -->
    <div class="tab-panel active" id="tab-overview">
      ${p.leadId?`<div class="lead-banner">
        <svg width="14" height="14" fill="none" stroke="#60a5fa" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Project Information</span>

            <span style="font-size:12px;color:var(--muted)">Status:</span>

              ${Object.entries(STATUS_LABELS).map(([v,l])=>`<option value="${v}"${p.status===v?' selected':''}>${l}</option>`).join('')}

              <label class="form-label">Project Name *</label>

            </div>

              <select class="form-control" id="e-projectType">
                <option value="">— Select —</option>
                ${['Home Automation','Office Automation','CCTV / Security','Networking','AV / Home Theatre','Smart Lighting','Access Control','Other'].map(t=>`<option${p.projectType===t?' selected':''}>${t}</option>`).join('')}
              </select>

              <label class="form-label">Budget (₹)</label>
              <input class="form-control" id="e-budget" type="number" min="0" step="10000" value="${p.budget||''}">

              <input class="form-control" id="e-clientContact" value="${esc(p.clientContact||'')}">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-control" id="e-clientEmail" type="email" value="${esc(p.clientEmail||'')}">
            </div>
            <div class="form-group">
              <label class="form-label">GSTIN</label>
              <input class="form-control" id="e-clientGSTIN" value="${esc(p.clientGSTIN||'')}" style="text-transform:uppercase">
            </div>
            <div class="section-sep">Notes</div>
            <div class="form-group full">
              <label class="form-label">Internal Notes</label>
              <textarea class="form-control" id="e-notes">${esc(p.notes||'')}</textarea>

          <div class="save-bar">

              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>

              Permanently removes this project and all linked data. Cannot be undone.
            </div>

    </div>

      if(p.assignedTo===u.username) o.selected=true;
      sel.appendChild(o);
    });

function tabPlaceholder(id, title, desc, btnLabel, iconId, iconPath, count, extraBtn=''){
  if(count>0) return `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">${count} record(s) — full UI coming soon.</div>`;
  return `<div class="placeholder-tab">
    <div class="icon-wrap"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="${iconPath}"/></svg></div>
    <div class="coming-soon-badge"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Coming Soon</div>
    <h3>${title}</h3>
    <p>${desc}</p>
    ${extraBtn||`<button class="btn btn-ghost btn-sm" disabled>${btnLabel} — Coming Soon</button>`}
  </div>`;
}

function showTab(name, btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  btn.classList.add('active');
  if(name==='survey'   && !window._svLoaded)       loadSurveyTab();
  if(name==='boq'      && !window._boqLoaded)      loadBOQTab();
  if(name==='proposal' && !window._propLoaded)     loadProposalTab();
}

async function quickUpdateStatus(){
  const newStatus=document.getElementById('status-select').value;
  try{
    await fetch(`${API}/api/projects/${projectId}`,{method:'PUT',headers:jh(),body:JSON.stringify({status:newStatus})});
    project.status=newStatus;
    document.getElementById('header-badge').innerHTML=statusBadge(newStatus);
    // Re-render stepper
    const stepperEl=document.querySelector('.stepper')||document.querySelector('[class^="stepper"]');
    const phHeader=document.querySelector('.project-header');
    if(phHeader){
      const existing=phHeader.querySelector('.stepper');
      if(existing) existing.outerHTML=renderStepper(newStatus);
    }
    toast(`Status updated to "${STATUS_LABELS[newStatus]}"`);
  }catch{ toast('Status update failed','error'); }
}

async function saveProject(){
  const pn=document.getElementById('e-projectName').value.trim();
  const cn=document.getElementById('e-clientName').value.trim();
  if(!pn||!cn){ toast('Project Name and Client Name are required','error'); return; }
  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…';
  try{
    const res=await fetch(`${API}/api/projects/${projectId}`,{method:'PUT',headers:jh(),body:JSON.stringify({
      projectName:   pn,
      clientName:    cn,
      clientContact: document.getElementById('e-clientContact').value.trim()||null,
      clientEmail:   document.getElementById('e-clientEmail').value.trim()||null,
      clientGSTIN:   document.getElementById('e-clientGSTIN').value.trim().toUpperCase()||null,
      location:      document.getElementById('e-location').value.trim()||null,
      projectType:   document.getElementById('e-projectType').value||null,
      budget:        parseFloat(document.getElementById('e-budget').value)||null,
      assignedTo:    document.getElementById('e-assignedTo').value||null,
      notes:         document.getElementById('e-notes').value.trim()||null,
    })}).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Save failed');
    project.projectName=pn; project.clientName=cn;
    document.getElementById('bc-name').textContent=pn;
    document.title=`${pn} — A.G.R`;
    const msg=document.getElementById('save-msg'); msg.textContent='Saved!'; msg.style.color='#4ade80'; msg.style.display='';
    setTimeout(()=>msg.style.display='none',2500);
    toast('Project saved');
  }catch(e){ toast(e.message||'Save failed','error'); }
  finally{ btn.disabled=false; btn.innerHTML='<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Changes'; }
}

async function deleteProject(){
  if(!confirm(`Delete project "${project?.projectName}"? This cannot be undone.`)) return;
  try{
    await fetch(`${API}/api/projects/${projectId}`,{method:'DELETE',headers:ah()});
    toast('Project deleted');
    setTimeout(()=>location.href='projects.html',1000);

}

async function doLogout(){

}

window._propLoaded = false;
window._proposals = [];

async function loadProposalTab(){
  const ui=document.getElementById('proposal-ui'); if(!ui) return;
  ui.innerHTML='<div style="padding:32px;text-align:center;color:var(--muted)">Loading…</div>';
  try{
    // Fetch proposals + approved BOQs in parallel
    const [propData, boqData] = await Promise.all([
      fetch(`${API}/api/projects/${projectId}/proposals`,{headers:ah()}).then(r=>r.json()),
      window._boqLoaded
        ? Promise.resolve({boqs: window._boqs||[]})
        : fetch(`${API}/api/projects/${projectId}/boqs`,{headers:ah()}).then(r=>r.json()).catch(()=>({boqs:[]}))
    ]);
    window._proposals = propData.proposals||[];
    if(!window._boqLoaded && boqData.boqs){
      window._boqs = boqData.boqs;
      boqData.boqs.forEach(b=>{ try{ window._boqItems[b.id]=JSON.parse(b.items_json||'[]'); }catch{ window._boqItems[b.id]=[]; } });
    }
    window._propLoaded = true;
    renderProposalUI();
  }catch{
    ui.innerHTML='<div style="padding:32px;text-align:center;color:#f87171">Failed to load proposals.</div>';
  }
}

function propStatusBadge(s, cr){
  if(cr==='negotiating') return `<span class="badge badge-negotiating">Negotiating</span>`;
  const map={draft:'badge-bq-draft',sent:'badge-sent',accepted:'badge-accepted',rejected:'badge-rejected'};
  const lbl={draft:'Draft',sent:'Sent',accepted:'Accepted',rejected:'Rejected'};
  return `<span class="badge ${map[s]||'badge-sent'}">${lbl[s]||s}</span>`;
}

function renderProposalUI(){
  const ui=document.getElementById('proposal-ui'); if(!ui) return;
  const proposals=window._proposals||[];
  const approvedBOQs=(window._boqs||[]).filter(b=>b.status==='approved');
  const sentBOQIds=new Set(proposals.map(p=>p.boqId));
  const unsent=approvedBOQs.filter(b=>!sentBOQIds.has(b.id));

  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:14px;font-weight:600">${proposals.length} Proposal${proposals.length!==1?'s':''}</div>
    ${unsent.length?`<button class="btn btn-primary btn-sm" onclick="openSendProposalModal()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Send Proposal
    </button>`:''}
  </div>`;

  if(!proposals.length){
    if(approvedBOQs.length){
      html+=`<div class="placeholder-tab">
        <div class="icon-wrap"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
        <h3>Ready to Send</h3>
        <p>You have ${approvedBOQs.length} approved BOQ${approvedBOQs.length>1?'s':''}. Send it to the client as a Zoho Books estimate to get their response.</p>
      </div>`;
    } else {
      html+=`<div class="placeholder-tab">
        <div class="icon-wrap"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
        <h3>No Proposals Yet</h3>
        <p>Approve a BOQ first, then come back here to send it to the client as a Zoho Books estimate.</p>
        <button class="btn btn-ghost btn-sm" onclick="showTab('boq',document.querySelector('.tab-btn[onclick*=boq]'))">Go to BOQ Tab</button>
      </div>`;
    }
  } else {
    proposals.forEach(p=>{ html+=renderProposalCard(p); });
  }

  html+=`<div id="prop-modal"></div>`;
  ui.innerHTML=html;
}

function renderProposalCard(p){
  let totals={};
  try{ totals=JSON.parse(p.boqTotals||'{}'); }catch{}
  const grandTotal=totals.grandTotal||0;
  const isAccepted=p.status==='accepted';
  const isRejected=p.status==='rejected';
  const isResolved=isAccepted||isRejected;
  const cardClass=isAccepted?' accepted':isRejected?' rejected':'';

  return `<div class="prop-card${cardClass}" id="propc-${p.id}">
    <div class="prop-card-hd">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">BOQ v${p.boqVersion||'?'} — Sent ${fmtDate(p.sentDate)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">
          ${p.zohoEstimateNumber?`Zoho: ${esc(p.zohoEstimateNumber)}  ·  `:''} Grand Total: ${fmt(grandTotal)}
        </div>
      </div>
      ${propStatusBadge(p.status, p.clientResponse)}
    </div>
    <div class="prop-card-bd">
      ${p.zohoEstimateId?`<a class="zoho-link" href="https://books.zoho.in/app#/estimates/${esc(p.zohoEstimateId)}" target="_blank" style="margin-bottom:16px;display:inline-flex">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Estimate in Zoho Books
      </a>`:''}

      ${isResolved
        ? `<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:8px;background:${isAccepted?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)'};border:1px solid ${isAccepted?'rgba(34,197,94,.2)':'rgba(239,68,68,.2)'}">
            <svg width="14" height="14" fill="none" stroke="${isAccepted?'#4ade80':'#f87171'}" stroke-width="2" viewBox="0 0 24 24">${isAccepted?'<polyline points="20 6 9 17 4 12"/>':'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'}</svg>
            <div>
              <div style="font-size:13px;font-weight:600;color:${isAccepted?'#4ade80':'#f87171'}">${isAccepted?'Accepted':'Rejected'} on ${fmtDate(p.clientResponseDate)}</div>
              ${p.remarks?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(p.remarks)}</div>`:''}
              <div style="font-size:12px;color:var(--muted);margin-top:2px">Project status advanced to <strong>${isAccepted?'Accepted':'Rejected'}</strong></div>
            </div>
          </div>`
        : `<div>
            <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px">Client Response</div>
            <div class="prop-resp-group">
              <label class="prop-resp-label"><input type="radio" name="resp-${p.id}" value="accepted" ${p.clientResponse==='accepted'?'checked':''}> Accepted</label>
              <label class="prop-resp-label"><input type="radio" name="resp-${p.id}" value="rejected" ${p.clientResponse==='rejected'?'checked':''}> Rejected</label>
              <label class="prop-resp-label"><input type="radio" name="resp-${p.id}" value="negotiating" ${p.clientResponse==='negotiating'?'checked':''}> Negotiating</label>
            </div>
            <div class="form-group" style="margin-bottom:12px">
              <label class="form-label">Remarks</label>
              <textarea class="form-control" id="prop-remarks-${p.id}" rows="2" placeholder="Client feedback, price negotiation notes…">${esc(p.remarks||'')}</textarea>
            </div>
            <button class="btn btn-primary btn-sm" onclick="saveProposalResponse(${p.id})">Save Response</button>
          </div>`
      }
    </div>
  </div>`;
}

async function saveProposalResponse(id){
  const selected=document.querySelector(`input[name="resp-${id}"]:checked`);
  if(!selected){ toast('Select a response first','error'); return; }
  const clientResponse=selected.value;
  const remarks=document.getElementById(`prop-remarks-${id}`)?.value.trim()||'';
  try{
    const res=await fetch(`${API}/api/proposals/${id}/response`,{
      method:'PUT',headers:jh(),body:JSON.stringify({clientResponse,remarks})
    }).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Failed');
    toast(`Response saved: ${clientResponse}`);
    if(clientResponse==='accepted'||clientResponse==='rejected'){
      project.status=clientResponse;
      document.getElementById('header-badge').innerHTML=statusBadge(clientResponse);
      const ph=document.querySelector('.project-header');
      if(ph){ const ex=ph.querySelector('.stepper'); if(ex) ex.outerHTML=renderStepper(clientResponse); }
      const ss=document.getElementById('status-select'); if(ss) ss.value=clientResponse;
    }
    window._propLoaded=false;
    await loadProposalTab();
  }catch(e){ toast(e.message||'Failed to save response','error'); }
}

        This will create a Zoho Books estimate for <strong style="color:var(--text)">${esc(project?.clientName||'the client')}</strong> and advance the project status to "Proposal Sent".

        <div class="ai-gen-anim"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>

          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Confirm & Send
        </button>
      </div>
    </div>
  </div>`;
}

function closePropModal(){
  const c=document.getElementById('prop-modal'); if(c) c.innerHTML='';
}

async function confirmSendProposal(){
  const selected=document.querySelector('input[name="prop-boq"]:checked');
  if(!selected){ toast('Select a BOQ version first','error'); return; }
  const boqId=Number(selected.value);
  const btn=document.getElementById('prop-send-btn');
  if(btn) btn.disabled=true;
  document.getElementById('prop-boq-select').style.display='none';
  document.getElementById('prop-sending').style.display='';
  try{
    const res=await fetch(`${API}/api/boqs/${boqId}/send-proposal`,{method:'POST',headers:jh()}).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Failed to send proposal');
    toast(`Proposal sent! Zoho Estimate: ${res.zohoEstimateNumber}`);
    project.status='proposal_sent';
    document.getElementById('header-badge').innerHTML=statusBadge('proposal_sent');
    const ph=document.querySelector('.project-header');
    if(ph){ const ex=ph.querySelector('.stepper'); if(ex) ex.outerHTML=renderStepper('proposal_sent'); }
    const ss=document.getElementById('status-select'); if(ss) ss.value='proposal_sent';
    if(project.counts) project.counts.proposals=(project.counts.proposals||0)+1;
    const tc=document.querySelector('.tab-btn[onclick*="proposal"] .tab-count');
    if(tc) tc.textContent=project.counts.proposals||'';
    closePropModal();
    window._propLoaded=false;
    await loadProposalTab();
  }catch(e){
    toast(e.message||'Failed to send proposal','error');
    if(btn) btn.disabled=false;
    document.getElementById('prop-boq-select').style.display='';
    document.getElementById('prop-sending').style.display='none';
  }
}

function boqStatusBadge(s){
  const map={draft:'badge-bq-draft',review:'badge-bq-review',approved:'badge-bq-approved',rejected:'badge-bq-rejected'};
  const lbl={draft:'Draft',review:'Under Review',approved:'Approved',rejected:'Rejected'};
  return `<span class="badge ${map[s]||'badge-bq-draft'}">${lbl[s]||s}</span>`;
}

function calcTotals(items, discount=0){
  const subtotal=items.reduce((s,it)=>s+(Number(it.quantity)||0)*(Number(it.unitRate)||0),0);
  const discountedSubtotal=Math.max(0,subtotal-discount);
  const gst=discountedSubtotal*0.18;
  const productsTotal=discountedSubtotal+gst;
  const installation=productsTotal*0.10;
  const commissioning=productsTotal*0.05;
  const grandTotal=productsTotal+installation+commissioning;
  return {subtotal,discount,gst,productsTotal,installation,commissioning,grandTotal};
}

function renderBOQCard(b, expanded=false){
  const items=window._boqItems[b.id]||[];
  let totals={};
  try{ totals=JSON.parse(b.totals_json||'{}'); }catch{}
  const total=totals.grandTotal||0;
  const typeIcon = b.generationType==='ai'
    ? `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> AI`
    : `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Manual`;

  return `<div class="boq-card${expanded?'':' collapsed'}" id="boqc-${b.id}">
    <div class="boq-card-hd" onclick="toggleBOQCard(${b.id})">
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px">${typeIcon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">v${b.version} — ${fmtDate(b.createdAt)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:1px">${items.length} item${items.length!==1?'s':''} · Grand Total: ${fmt(total)}</div>
      </div>
      ${boqStatusBadge(b.status)}
      <svg class="boq-arrow" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="${expanded?'transform:rotate(180deg)':''}"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="boq-card-bd">
      ${renderBOQEditor(b)}
    </div>
  </div>`;
}

function renderBOQEditor(b){
  const items=window._boqItems[b.id]||[];
  let totals={};
  try{ totals=JSON.parse(b.totals_json||'{}'); }catch{}
  const discount=totals.discount||0;
  const isApproved=b.status==='approved';

  const rows=items.map((it,i)=>`<tr id="row-${b.id}-${i}">
    <td style="width:30px;color:var(--muted);font-size:11px;text-align:center">${i+1}</td>
    <td style="min-width:200px"><div class="prod-ac">
      <input value="${esc(it.itemName||'')}" placeholder="Search product…" oninput="prodSearch(${b.id},${i},this)" onfocus="prodSearch(${b.id},${i},this)" onblur="setTimeout(()=>closeProdDD(${b.id},${i}),180)" ${isApproved?'disabled':''}>
      <div class="prod-ac-dd" id="prod-dd-${b.id}-${i}"></div>
    </div></td>
    <td style="width:70px"><input type="number" min="0.01" step="0.01" value="${it.quantity||1}" onchange="updateBOQItem(${b.id},${i},'quantity',this.value)" style="text-align:center" ${isApproved?'disabled':''}></td>
    <td style="width:60px"><input value="${esc(it.unit||'pcs')}" onchange="updateBOQItem(${b.id},${i},'unit',this.value)" style="text-align:center" ${isApproved?'disabled':''}></td>
    <td style="width:90px"><input type="number" min="0" step="1" value="${it.unitRate||0}" onchange="updateBOQItem(${b.id},${i},'unitRate',this.value)" style="text-align:right" ${isApproved?'disabled':''}></td>
    <td class="num-cell">${fmt((it.quantity||0)*(it.unitRate||0))}</td>
    ${isApproved?'<td></td>':`<td style="width:30px;text-align:center"><button class="btn btn-danger btn-sm" style="padding:2px 6px;font-size:11px" onclick="removeBOQItem(${b.id},${i})">✕</button></td>`}
  </tr>`).join('');

  const recalc=calcTotals(items, discount);

  return `
    <div style="overflow-x:auto">
      <table class="items-table">
        <thead><tr>
          <th>#</th><th>Product</th><th style="text-align:center">Qty</th><th style="text-align:center">Unit</th><th style="text-align:right">Rate (₹)</th><th style="text-align:right">Total</th><th></th>
        </tr></thead>
        <tbody id="items-body-${b.id}">${rows}</tbody>
      </table>
    </div>
    ${!isApproved?`<button class="btn btn-ghost btn-sm" style="margin-bottom:16px" onclick="addBOQItem(${b.id})">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Item
    </button>`:''}

    <div class="fin-panel" id="fin-${b.id}">
      <div class="fin-row"><span class="fin-lbl">Subtotal</span><span class="fin-val" id="fin-sub-${b.id}">${fmt(recalc.subtotal)}</span></div>
      <div class="fin-row"><span class="fin-lbl">Discount (₹)</span>
        ${isApproved?`<span class="fin-val">${fmt(discount)}</span>`
          :`<input class="fin-disc-inp" id="fin-disc-${b.id}" type="number" min="0" step="100" value="${discount}" onchange="recalcFin(${b.id})">`}
      </div>

function toggleBOQCard(id){

// ── Product autocomplete ───────────────────────────────────────────────────

function prodSearch(boqId, rowIdx, input){
  const q=input.value.toLowerCase().trim();
  const prods=window._boqProducts||[];
  const matches = q.length<1 ? prods.slice(0,12) : prods.filter(p=>p.name.toLowerCase().includes(q)).slice(0,12);
  const dd=document.getElementById(`prod-dd-${boqId}-${rowIdx}`);
  if(!dd) return;
  if(!matches.length){ dd.style.display='none'; return; }
  dd.innerHTML=matches.map((p,i)=>`<div class="prod-ac-item" onmousedown="selectProd(${boqId},${rowIdx},'${p.name.replace(/'/g,"\\'")}',${p.rate},'${(p.unit||'pcs').replace(/'/g,"\\'")}')">
    <div class="prod-ac-name">${esc(p.name)}</div>
    <div class="prod-ac-meta">${p.unit||'pcs'} · ₹${Number(p.rate).toLocaleString('en-IN')}</div>
  </div>`).join('');
  dd.style.display='block';
}

function closeProdDD(boqId, rowIdx){
  const dd=document.getElementById(`prod-dd-${boqId}-${rowIdx}`); if(dd) dd.style.display='none';
}

function selectProd(boqId, rowIdx, name, rate, unit){
  const items=window._boqItems[boqId];
  if(!items) return;
  items[rowIdx] = {...items[rowIdx], itemName:name, unitRate:rate, unit};
  // Update row inputs
  const row=document.getElementById(`row-${boqId}-${rowIdx}`);
  if(row){
    const inp=row.querySelector('.prod-ac input'); if(inp) inp.value=name;
    const inputs=row.querySelectorAll('td input');
    inputs.forEach(i=>{ if(i.style.textAlign==='right') i.value=rate; if(i.style.textAlign==='center'&&i.type!=='number') i.value=unit; });
  }
  closeProdDD(boqId, rowIdx);
  updateRowTotal(boqId, rowIdx);
  recalcFin(boqId);
}

function updateBOQItem(boqId, rowIdx, field, value){
  const items=window._boqItems[boqId]; if(!items) return;
  items[rowIdx][field] = field==='quantity'||field==='unitRate' ? Number(value) : value;
  if(field==='quantity'||field==='unitRate') updateRowTotal(boqId,rowIdx);
  recalcFin(boqId);
}

function updateRowTotal(boqId, rowIdx){
  const items=window._boqItems[boqId]; if(!items||!items[rowIdx]) return;
  const it=items[rowIdx];
  const cell=document.querySelector(`#row-${boqId}-${rowIdx} .num-cell`);
  if(cell) cell.textContent=fmt((it.quantity||0)*(it.unitRate||0));
}

function addBOQItem(boqId){
  const items=window._boqItems[boqId]||[];
  items.push({itemName:'',quantity:1,unit:'pcs',unitRate:0});
  window._boqItems[boqId]=items;
  const tbody=document.getElementById(`items-body-${boqId}`); if(!tbody) return;
  const i=items.length-1;
  const tr=document.createElement('tr'); tr.id=`row-${boqId}-${i}`;
  tr.innerHTML=`
    <td style="width:30px;color:var(--muted);font-size:11px;text-align:center">${i+1}</td>
    <td style="min-width:200px"><div class="prod-ac">
      <input value="" placeholder="Search product…" oninput="prodSearch(${boqId},${i},this)" onfocus="prodSearch(${boqId},${i},this)" onblur="setTimeout(()=>closeProdDD(${boqId},${i}),180)">
      <div class="prod-ac-dd" id="prod-dd-${boqId}-${i}"></div>
    </div></td>
    <td style="width:70px"><input type="number" min="0.01" step="0.01" value="1" onchange="updateBOQItem(${boqId},${i},'quantity',this.value)" style="text-align:center"></td>
    <td style="width:60px"><input value="pcs" onchange="updateBOQItem(${boqId},${i},'unit',this.value)" style="text-align:center"></td>
    <td style="width:90px"><input type="number" min="0" step="1" value="0" onchange="updateBOQItem(${boqId},${i},'unitRate',this.value)" style="text-align:right"></td>
    <td class="num-cell">₹0</td>
    <td style="width:30px;text-align:center"><button class="btn btn-danger btn-sm" style="padding:2px 6px;font-size:11px" onclick="removeBOQItem(${boqId},${i})">✕</button></td>`;
  tbody.appendChild(tr);
  tr.querySelector('input').focus();
}

function removeBOQItem(boqId, rowIdx){
  const items=window._boqItems[boqId]||[]; if(!items[rowIdx]) return;
  items.splice(rowIdx,1);
  window._boqItems[boqId]=items;
  // Re-render just the editor section
  const card=document.getElementById(`boqc-${boqId}`);
  const boq=(window._boqs||[]).find(b=>b.id===boqId);
  if(card&&boq){
    boq.totals_json=JSON.stringify(calcTotals(items,0));
    card.querySelector('.boq-card-bd').innerHTML=renderBOQEditor(boq);
  }
  recalcFin(boqId);
}

function recalcFin(boqId){
  const items=window._boqItems[boqId]||[];
  const discInp=document.getElementById(`fin-disc-${boqId}`);
  const discount=discInp?parseFloat(discInp.value)||0:0;
  const t=calcTotals(items,discount);
  const set=(id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=fmt(val); };
  set(`fin-sub-${boqId}`, t.subtotal);
  set(`fin-gst-${boqId}`, t.gst);
  set(`fin-pt-${boqId}`,  t.productsTotal);
  set(`fin-inst-${boqId}`,t.installation);
  set(`fin-comm-${boqId}`,t.commissioning);
  set(`fin-gt-${boqId}`,  t.grandTotal);
}

// ── BOQ save / approve / delete ────────────────────────────────────────────

async function saveBOQ(id, action){
  const items=window._boqItems[id]||[];
  const discInp=document.getElementById(`fin-disc-${id}`);
  const discount=discInp?parseFloat(discInp.value)||0:0;
  const totals=calcTotals(items,discount);

  if(action==='approve'){
    if(!confirm('Approve this BOQ? Once approved it cannot be edited.')) return;
    try{
      // Save latest items first, then approve
      await fetch(`${API}/api/boqs/${id}`,{method:'PUT',headers:jh(),body:JSON.stringify({
        items_json:JSON.stringify(items), totals_json:JSON.stringify(totals), status:'review'
      })}).then(r=>r.json());
      const res=await fetch(`${API}/api/boqs/${id}/approve`,{method:'POST',headers:jh()}).then(r=>r.json());
      if(!res.success) throw new Error(res.error||'Failed');
      toast('BOQ approved!');
      project.status='boq_draft'; // Keep track
      window._boqLoaded=false;
      await loadBOQTab();
    }catch(e){ toast(e.message||'Approve failed','error'); }
    return;
  }

  const status = action==='review'?'review':'draft';
  try{
    const res=await fetch(`${API}/api/boqs/${id}`,{method:'PUT',headers:jh(),body:JSON.stringify({
      items_json:JSON.stringify(items), totals_json:JSON.stringify(totals), status
    })}).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Save failed');
    const boq=(window._boqs||[]).find(b=>b.id===id);
    if(boq){ boq.items_json=JSON.stringify(items); boq.totals_json=JSON.stringify(totals); boq.status=status; }
    toast(action==='review'?'Submitted for review':'Draft saved');
    if(action==='review'){ window._boqLoaded=false; await loadBOQTab(); }
  }catch(e){ toast(e.message||'Save failed','error'); }
}

async function deleteBOQ(id){
  if(!confirm('Delete this BOQ version? This cannot be undone.')) return;
  try{
    await fetch(`${API}/api/boqs/${id}`,{method:'DELETE',headers:ah()});
    toast('BOQ deleted');
    if(project.counts) project.counts.boqs=Math.max(0,(project.counts.boqs||1)-1);
    const tc=document.querySelector('.tab-btn[onclick*="boq"] .tab-count');
    if(tc) tc.textContent=project.counts.boqs||0;
    window._boqLoaded=false;
    await loadBOQTab();
  }catch(e){ toast(e.message||'Delete failed','error'); }
}

async function createManualBOQ(){
  try{
    const res=await fetch(`${API}/api/projects/${projectId}/boqs`,{
      method:'POST',headers:jh(),body:JSON.stringify({generationType:'manual',items_json:'[]',totals_json:'{}'}),
    }).then(r=>r.json());

    toast(`BOQ v${res.version} created`);
    if(project.counts) project.counts.boqs=(project.counts.boqs||0)+1;

async function runAIGeneration(){
  const surveyId=document.getElementById('ai-survey-sel')?.value||null;
  const requirements=document.getElementById('ai-req')?.value.trim()||'';
  const btn=document.getElementById('ai-gen-btn');
  if(btn) btn.disabled=true;
  document.getElementById('ai-form').style.display='none';
  document.getElementById('ai-loading').style.display='';
  try{
    const res=await fetch(`${API}/api/boqs/generate-ai`,{
      method:'POST',headers:jh(),
      body:JSON.stringify({projectId:Number(projectId),surveyId:surveyId?Number(surveyId):null,requirements})
    }).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Generation failed');
    toast(`BOQ v${res.version} generated with ${res.items?.length||0} items`);
    if(project.counts) project.counts.boqs=(project.counts.boqs||0)+1;
    const tc=document.querySelector('.tab-btn[onclick*="boq"] .tab-count');
    if(tc) tc.textContent=project.counts.boqs||'';
    closeBOQModal();
    window._boqLoaded=false;

  }catch(e){

    document.getElementById('ai-loading').style.display='none';
    document.getElementById('ai-form').style.display='';
    if(btn) btn.disabled=false;
  }
}

window._svPhotos = {}; // { [id]: [{url,caption}] }
window._svPlans  = {}; // { [id]: [{url,label}] }
window._svLoaded = false;

async function loadSurveyTab(){
  const ui = document.getElementById('survey-ui');
  if(!ui) return;
  ui.innerHTML='<div style="padding:32px;text-align:center;color:var(--muted)">Loading…</div>';
  try{
    const data = await fetch(`${API}/api/projects/${projectId}/surveys`,{headers:ah()}).then(r=>r.json());
    window._surveys = data.surveys||[];
    window._svLoaded = true;
    // Init file state from stored JSON
    window._surveys.forEach(sv=>{
      try{ window._svPhotos[sv.id]=JSON.parse(sv.photos_json||'[]'); }catch{ window._svPhotos[sv.id]=[]; }
      try{ window._svPlans[sv.id] =JSON.parse(sv.floorPlans_json||'[]'); }catch{ window._svPlans[sv.id]=[]; }
    });

  return `<span class="badge ${map[s]||''}">${lbl[s]||s}</span>`;
}

function renderSurveyCard(sv, expanded=false){
  let meas={};
  try{ meas=JSON.parse(sv.measurements_json||'{}'); }catch{}
  const rooms=Object.keys(meas);
  const photos=window._svPhotos[sv.id]||[];
  const plans =window._svPlans[sv.id]||[];
  const meta=[sv.surveyDate?fmtDate(sv.surveyDate):'Date TBD', sv.surveyorName||'Surveyor TBD'].join(' · ');
  const counts=[];
  if(rooms.length) counts.push(`${rooms.length} room${rooms.length>1?'s':''}`);
  if(photos.length) counts.push(`${photos.length} photo${photos.length>1?'s':''}`);
  if(plans.length)  counts.push(`${plans.length} plan${plans.length>1?'s':''}`);

  return `<div class="sv-card${expanded?'':' collapsed'}" id="svc-${sv.id}">
    <div class="sv-card-hd" onclick="toggleSurvey(${sv.id})">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

    </div>

      ${renderSurveyBody(sv, meas)}
    </div>
  </div>`;
}

function renderSurveyBody(sv, meas){
  const photos=window._svPhotos[sv.id]||[];
  const plans =window._svPlans[sv.id]||[];
  meas=meas||{};
  const rooms=Object.keys(meas);

  const photoGrid=photos.map((p,i)=>`<div class="file-thumb">
    <img src="${p.url}" alt="" onclick="previewImg('${p.url}')">
    <button class="ft-del" onclick="removePhoto(${sv.id},${i})">✕</button>
  </div>`).join('');

  const planGrid=plans.map((p,i)=>{
    const isImg=p.url.startsWith('data:image');
    return `<div class="file-thumb">
      ${isImg?`<img src="${p.url}" alt="">`
        :`<div class="file-doc"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${esc(p.label||'Plan')}</span></div>`}
      <button class="ft-del" onclick="removePlan(${sv.id},${i})">✕</button>
    </div>`;
  }).join('');

  const measRows=rooms.map(room=>{
    const r=meas[room]||{};
    return `<tr>
      <td><input value="${esc(room)}" data-field="name" data-orig="${esc(room)}" onchange="updateMeasName(${sv.id},this)"></td>
      <td><input type="number" step="0.1" min="0" value="${r.length||''}" data-room="${esc(room)}" data-field="length"></td>
      <td><input type="number" step="0.1" min="0" value="${r.width||''}" data-room="${esc(room)}" data-field="width"></td>
      <td><input type="number" step="0.1" min="0" value="${r.height||''}" data-room="${esc(room)}" data-field="height"></td>
      <td><button class="btn btn-danger btn-sm" style="padding:3px 8px" onclick="removeMeasRow(${sv.id},'${room.replace(/'/g,"\\'")}')">✕</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="sv-section">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Survey Date</label>
          <input class="form-control" id="svd-${sv.id}" type="date" value="${sv.surveyDate||''}">
        </div>
        <div class="form-group">
          <label class="form-label">Surveyor Name</label>
          <input class="form-control" id="svn-${sv.id}" value="${esc(sv.surveyorName||'')}" placeholder="e.g. Ramesh Kumar">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" id="svs-${sv.id}">
            <option value="scheduled"${sv.status==='scheduled'?' selected':''}>Scheduled</option>
            <option value="in_progress"${sv.status==='in_progress'?' selected':''}>In Progress</option>
            <option value="completed"${sv.status==='completed'?' selected':''}>Completed</option>
          </select>
        </div>
      </div>
    </div>

    <div class="sv-section">
      <div class="sv-section-title">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Floor Plans
        <span style="font-size:10px;color:var(--muted);font-weight:400">(images or PDFs — stored locally for now)</span>
      </div>
      <div class="file-grid" id="plan-grid-${sv.id}">${planGrid}</div>
      <label class="file-upload-label">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Floor Plans
        <input type="file" multiple accept="image/*,.pdf" style="display:none" onchange="handlePlanUpload(${sv.id},this)">
      </label>
    </div>

    <div class="sv-section">
      <div class="sv-section-title">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Site Photos
      </div>
      <div class="file-grid" id="photo-grid-${sv.id}">${photoGrid}</div>
      <label class="file-upload-label">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Photos
        <input type="file" multiple accept="image/*" style="display:none" onchange="handlePhotoUpload(${sv.id},this)">
      </label>
    </div>

    <div class="sv-section">
      <div class="sv-section-title">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        Measurements
        <span style="font-size:10px;color:var(--muted);font-weight:400">(metres)</span>
      </div>
      <table class="meas-table">
        <thead><tr><th>Room / Area</th><th>Length</th><th>Width</th><th>Height</th><th></th></tr></thead>
        <tbody id="meas-body-${sv.id}">${measRows}</tbody>
      </table>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addMeasRow(${sv.id})">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Room
      </button>
    </div>

    <div class="sv-section">
      <div class="sv-section-title">Notes</div>
      <textarea class="form-control" id="svnotes-${sv.id}" rows="3">${esc(sv.notes||'')}</textarea>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)">
      <button class="btn btn-primary btn-sm" onclick="saveSurvey(${sv.id})">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Save Changes
      </button>
      ${sv.status!=='completed'?`<button class="btn btn-success btn-sm" onclick="markSurveyComplete(${sv.id})">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Mark Survey Complete
      </button>`:'<span style="font-size:12px;color:#4ade80;display:flex;align-items:center;gap:4px"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Survey Completed</span>'}
      <button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="deleteSurvey(${sv.id})">Delete Survey</button>
    </div>`;
}

function toggleSurvey(id){
  const card=document.getElementById(`svc-${id}`);
  if(!card) return;
  card.classList.toggle('collapsed');
  const arrow=card.querySelector('.sv-arrow');
  if(arrow) arrow.style.transform=card.classList.contains('collapsed')?'':'rotate(180deg)';
}

function showSurveyForm(){
  const f=document.getElementById('sv-new-form');
  if(f){ f.style.display=''; f.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
function hideSurveyForm(){
  const f=document.getElementById('sv-new-form'); if(f) f.style.display='none';
}

async function createSurvey(){
  const date    =document.getElementById('sv-new-date').value;
  const surveyor=document.getElementById('sv-new-surveyor').value.trim();
  const notes   =document.getElementById('sv-new-notes').value.trim();
  try{
    const res=await fetch(`${API}/api/projects/${projectId}/surveys`,{
      method:'POST',headers:jh(),
      body:JSON.stringify({surveyDate:date||null,surveyorName:surveyor||null,notes:notes||null,status:'scheduled'})
    }).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Failed');
    toast('Survey scheduled');
    if(project.counts) project.counts.surveys=(project.counts.surveys||0)+1;
    const tc=document.querySelector('.tab-btn[onclick*="survey"] .tab-count');
    if(tc) tc.textContent=project.counts.surveys||'';
    window._svLoaded=false;
    await loadSurveyTab();
  }catch(e){ toast(e.message||'Failed to create survey','error'); }
}

function resizeImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width:w,height:h}=img;
        const max=1200;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.8));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(id, input){
  const files=Array.from(input.files); if(!files.length) return;
  toast('Processing photos…');
  const photos=window._svPhotos[id]||[];
  for(const f of files){
    if(!f.type.startsWith('image/')){ toast(`${f.name}: not an image, skipped`,'error'); continue; }
    const url=await resizeImg(f);
    photos.push({url,caption:f.name.replace(/\.[^.]+$/,'')});
  }
  window._svPhotos[id]=photos;
  refreshPhotoGrid(id);
  input.value='';
  toast(`${files.length} photo${files.length>1?'s':''} added — click Save Changes`);
}

async function handlePlanUpload(id, input){
  const files=Array.from(input.files); if(!files.length) return;
  toast('Processing floor plans…');
  const plans=window._svPlans[id]||[];
  for(const f of files){
    let url;
    if(f.type.startsWith('image/')) url=await resizeImg(f);
    else url=await new Promise(r=>{ const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(f); });
    plans.push({url,label:f.name.replace(/\.[^.]+$/,'')});
  }
  window._svPlans[id]=plans;
  refreshPlanGrid(id);
  input.value='';
  toast(`${files.length} floor plan${files.length>1?'s':''} added — click Save Changes`);
}

function refreshPhotoGrid(id){
  const grid=document.getElementById(`photo-grid-${id}`); if(!grid) return;
  const photos=window._svPhotos[id]||[];
  grid.innerHTML=photos.map((p,i)=>`<div class="file-thumb">
    <img src="${p.url}" alt="" onclick="previewImg('${p.url}')">
    <button class="ft-del" onclick="removePhoto(${id},${i})">✕</button>
  </div>`).join('');
}

function refreshPlanGrid(id){
  const grid=document.getElementById(`plan-grid-${id}`); if(!grid) return;
  const plans=window._svPlans[id]||[];
  grid.innerHTML=plans.map((p,i)=>{
    const isImg=p.url.startsWith('data:image');
    return `<div class="file-thumb">
      ${isImg?`<img src="${p.url}" alt="">`
        :`<div class="file-doc"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${esc(p.label||'Plan')}</span></div>`}
      <button class="ft-del" onclick="removePlan(${id},${i})">✕</button>
    </div>`;
  }).join('');
}

function removePhoto(id,idx){ const a=window._svPhotos[id]||[]; a.splice(idx,1); window._svPhotos[id]=a; refreshPhotoGrid(id); }
function removePlan(id,idx){  const a=window._svPlans[id]||[];  a.splice(idx,1); window._svPlans[id]=a;  refreshPlanGrid(id); }

function addMeasRow(id){
  const tbody=document.getElementById(`meas-body-${id}`); if(!tbody) return;
  const n=tbody.querySelectorAll('tr').length;
  const name=`Room ${n+1}`;
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><input value="${esc(name)}" data-field="name" data-orig="${esc(name)}" onchange="updateMeasName(${id},this)"></td>
    <td><input type="number" step="0.1" min="0" value="" data-room="${esc(name)}" data-field="length"></td>
    <td><input type="number" step="0.1" min="0" value="" data-room="${esc(name)}" data-field="width"></td>
    <td><input type="number" step="0.1" min="0" value="" data-room="${esc(name)}" data-field="height"></td>
    <td><button class="btn btn-danger btn-sm" style="padding:3px 8px" onclick="removeMeasRow(${id},'${esc(name)}')">✕</button></td>`;
  tbody.appendChild(tr);
}

function removeMeasRow(id, roomName){
  const tbody=document.getElementById(`meas-body-${id}`); if(!tbody) return;
  for(const row of tbody.querySelectorAll('tr')){
    const inp=row.querySelector('input[data-field="name"]');
    if(inp && inp.dataset.orig===roomName){ row.remove(); break; }
  }
}

function updateMeasName(id, input){
  const tr=input.closest('tr'); if(!tr) return;
  const newName=input.value.trim()||'Room';
  tr.querySelectorAll('input[data-field]').forEach(i=>{ if(i!==input) i.dataset.room=newName; });
  input.dataset.orig=newName;
  const del=tr.querySelector('button');
  if(del) del.setAttribute('onclick',`removeMeasRow(${id},'${newName.replace(/'/g,"\\'")}') `);
}

function collectMeasurements(id){
  const tbody=document.getElementById(`meas-body-${id}`); if(!tbody) return {};
  const meas={};
  for(const row of tbody.querySelectorAll('tr')){
    const name=(row.querySelector('input[data-field="name"]')?.value||'').trim();
    if(!name) continue;
    meas[name]={
      length:parseFloat(row.querySelector('input[data-field="length"]')?.value)||null,
      width: parseFloat(row.querySelector('input[data-field="width"]')?.value)||null,
      height:parseFloat(row.querySelector('input[data-field="height"]')?.value)||null,
    };
  }
  return meas;
}

async function saveSurvey(id){
  const body={
    surveyDate:       document.getElementById(`svd-${id}`)?.value||null,
    surveyorName:     document.getElementById(`svn-${id}`)?.value.trim()||null,
    notes:            document.getElementById(`svnotes-${id}`)?.value.trim()||null,
    status:           document.getElementById(`svs-${id}`)?.value||'scheduled',
    photos_json:      JSON.stringify(window._svPhotos[id]||[]),
    floorPlans_json:  JSON.stringify(window._svPlans[id]||[]),
    measurements_json:JSON.stringify(collectMeasurements(id)),
  };
  try{
    const res=await fetch(`${API}/api/surveys/${id}`,{method:'PUT',headers:jh(),body:JSON.stringify(body)}).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Save failed');
    toast('Survey saved');
    const sv=(window._surveys||[]).find(s=>s.id===id);
    if(sv) Object.assign(sv,body);
  }catch(e){ toast(e.message||'Save failed','error'); }
}

async function markSurveyComplete(id){
  if(!confirm('Mark survey as complete? This will also advance the project to "Survey Done".')) return;
  const body={
    surveyDate:       document.getElementById(`svd-${id}`)?.value||null,
    surveyorName:     document.getElementById(`svn-${id}`)?.value.trim()||null,
    notes:            document.getElementById(`svnotes-${id}`)?.value.trim()||null,
    status:           'completed',
    photos_json:      JSON.stringify(window._svPhotos[id]||[]),
    floorPlans_json:  JSON.stringify(window._svPlans[id]||[]),
    measurements_json:JSON.stringify(collectMeasurements(id)),
  };
  try{
    const res=await fetch(`${API}/api/surveys/${id}`,{method:'PUT',headers:jh(),body:JSON.stringify(body)}).then(r=>r.json());
    if(!res.success) throw new Error(res.error||'Failed');
    toast('Survey complete! Project advanced to Survey Done.');
    project.status='survey_done';
    document.getElementById('header-badge').innerHTML=statusBadge('survey_done');
    const ph=document.querySelector('.project-header');
    if(ph){ const ex=ph.querySelector('.stepper'); if(ex) ex.outerHTML=renderStepper('survey_done'); }
    const ss=document.getElementById('status-select'); if(ss) ss.value='survey_done';
    window._svLoaded=false;
    await loadSurveyTab();
  }catch(e){ toast(e.message||'Failed','error'); }
}

async function deleteSurvey(id){
  if(!confirm('Delete this survey? All photos, floor plans and measurements will be lost.')) return;
  try{
    await fetch(`${API}/api/surveys/${id}`,{method:'DELETE',headers:ah()});
    toast('Survey deleted');
    if(project.counts) project.counts.surveys=Math.max(0,(project.counts.surveys||1)-1);
    const tc=document.querySelector('.tab-btn[onclick*="survey"] .tab-count');
    if(tc) tc.textContent=project.counts.surveys||0;
    window._svLoaded=false;
    await loadSurveyTab();
  }catch(e){ toast(e.message||'Delete failed','error'); }
}

function previewImg(url){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  ov.onclick=()=>ov.remove();
  ov.innerHTML=`<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain">`;
  document.body.appendChild(ov);
}

async function init(){
  if(!getSession()){ location.href='login.html'; return; }
  const user=getUser();
  if(user){
    document.getElementById('user-name').textContent=user.fullName||user.username;
    document.getElementById('user-role').textContent=user.role;
    document.getElementById('avatar').textContent=(user.fullName||user.username||'?')[0].toUpperCase();
    if(user.role==='admin'){ document.getElementById('admin-section').style.display=''; document.getElementById('users-link').style.display=''; }
  }

  projectId=new URLSearchParams(location.search).get('id');
  if(!projectId){ document.getElementById('main-content').innerHTML='<div style="padding:40px;text-align:center;color:#f87171">No project ID specified.</div>'; return; }

  try{
    const [pData, uData] = await Promise.all([
      fetch(`${API}/api/projects/${projectId}`,{headers:ah()}).then(r=>r.json()),
      fetch(`${API}/api/auth/users`,{headers:ah()}).then(r=>r.json()).catch(()=>({users:[]}))
    ]);
    if(pData.error) throw new Error(pData.error);
    project=pData;
    window._users=uData.users||[];
    renderPage();
  }catch(e){
    document.getElementById('main-content').innerHTML=`<div style="padding:40px;text-align:center;color:#f87171">${e.message||'Failed to load project'}</div>`;
  }
}
init();
</script>
</body>
