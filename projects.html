<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G.R Automation — Projects</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #273549; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
    --green: #22c55e; --yellow: #eab308; --red: #ef4444; --orange: #f97316;
    --radius: 10px; --sidebar-w: 220px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; transition: transform .25s; }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo .brand { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .sidebar-logo .tagline { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; padding: 14px 10px 6px; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all .15s; margin-bottom: 2px; }
  .nav-link:hover { background: var(--surface2); color: var(--text); }
  .nav-link.active { background: var(--accent); color: #fff; }
  .sidebar-footer { padding: 14px 8px; border-top: 1px solid var(--border); }
  .user-pill { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; }
  .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: 11px; color: var(--muted); }
  .logout-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 6px; transition: all .15s; }
  .logout-btn:hover { background: var(--surface2); color: var(--red); }

  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
  .menu-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; border-radius: 6px; }
  .topbar-title { font-size: 16px; font-weight: 600; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .content { padding: 24px; flex: 1; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 12px 9px 34px; font-size: 13px; outline: none; transition: border-color .15s; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }
  .filter-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; cursor: pointer; }
  .filter-select:focus { border-color: var(--accent); }

  /* Project cards grid */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all .15s; text-decoration: none; color: inherit; display: block; }
  .project-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .project-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .project-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .project-client { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .project-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .project-value { font-size: 15px; font-weight: 700; color: var(--text); }
  .project-dates { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* Status badges */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-active { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge-completed { background: rgba(59,130,246,.15); color: #60a5fa; }
  .badge-on-hold { background: rgba(234,179,8,.15); color: #facc15; }
  .badge-cancelled { background: rgba(239,68,68,.15); color: #f87171; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all .15s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,.1); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
  .btn-danger:hover { background: rgba(239,68,68,.2); }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 300; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 18px; line-height: 1; }
  .modal-close:hover { color: var(--text); }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .form-control { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; font-family: inherit; transition: border-color .15s; }
  .form-control:focus { border-color: var(--accent); }
  .form-control::placeholder { color: var(--muted); }
  select.form-control option { background: var(--surface); }
  textarea.form-control { resize: vertical; min-height: 80px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* Empty / loading */
  .empty { padding: 64px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty svg { opacity: .3; margin-bottom: 12px; }
  .loading { padding: 48px; text-align: center; color: var(--muted); font-size: 13px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-size: 13px; z-index: 999; transform: translateY(80px); opacity: 0; transition: all .3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(34,197,94,.4); color: #4ade80; }
  .toast.error { border-color: rgba(239,68,68,.4); color: #f87171; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; }
  .overlay.open { display: block; }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }
    .main { margin-left: 0; }
    .menu-toggle { display: block; }
    .topbar { padding: 12px 16px; }
    .content { padding: 16px; }
    .projects-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="brand">A.G.R Automation</div>
    <div class="tagline">BOQ Management System</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>
    <a href="dashboard.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="quotes.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

      Clients
    </a>
    <div class="nav-section">Work</div>
    <a href="projects.html" class="nav-link active">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Projects
    </a>
    <a href="analytics.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Analytics

    <div class="nav-section" id="admin-section" style="display:none">Admin</div>
    <a href="users.html" class="nav-link" id="users-link" style="display:none">

      Users
    </a>
  </nav>
  <div class="sidebar-footer">

      <div class="user-avatar" id="avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</aside>

<div class="overlay" id="mob-overlay" onclick="closeSidebar()"></div>

<div class="main">
  <header class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Projects</span>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Project
      </button>
    </div>
  </header>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search" placeholder="Search projects or clients…" oninput="filterProjects()">
      </div>
      <select class="filter-select" id="status-filter" onchange="filterProjects()">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="on-hold">On Hold</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div id="projects-container">
      <div class="loading"><span class="spinner"></span>Loading projects…</div>
    </div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">
      New Project
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <form id="project-form" onsubmit="submitProject(event)">
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Project Name *</label>
          <input class="form-control" id="f-name" placeholder="e.g. Bungalow Automation - Phase 1" required>
        </div>
        <div class="form-group full">
          <label class="form-label">Client Name *</label>
          <input class="form-control" id="f-client" placeholder="e.g. Mr. Rajesh Sharma" required list="clients-list">
          <datalist id="clients-list"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-control" id="f-status">
            <option value="active">Active</option>
            <option value="on-hold">On Hold</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Total Value (₹)</label>
          <input class="form-control" id="f-value" type="number" min="0" step="1000" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Start Date</label>
          <input class="form-control" id="f-start" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">End Date</label>
          <input class="form-control" id="f-end" type="date">
        </div>
        <div class="form-group full">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="f-desc" placeholder="Project scope, location, requirements…"></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">Notes</label>
          <textarea class="form-control" id="f-notes" placeholder="Internal notes…"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Create Project</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://agr-boq-backend.agrayush98.workers.dev';
let allProjects = [];

function getSession() { return localStorage.getItem('sessionId'); }
function getUser() { try { return JSON.parse(localStorage.getItem('agr_user') || 'null'); } catch { return null; } }

async function logout() {
  await fetch(`${API}/api/auth/logout`, { method: 'POST', headers: { 'X-Session-ID': getSession() } }).catch(() => {});
  localStorage.clear();
  location.href = 'login.html';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

function fmt(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }

function statusBadge(s) {
  const map = { active: 'badge-active', completed: 'badge-completed', 'on-hold': 'badge-on-hold', cancelled: 'badge-cancelled' };
  const labels = { active: 'Active', completed: 'Completed', 'on-hold': 'On Hold', cancelled: 'Cancelled' };
  return `<span class="badge ${map[s] || 'badge-active'}">${labels[s] || s}</span>`;
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('project-form').reset(); }

function filterProjects() {
  const q = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('status-filter').value;
  const filtered = allProjects.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.clientName.toLowerCase().includes(q);
    const matchS = !status || p.status === status;
    return matchQ && matchS;
  });
  renderProjects(filtered);
}

function renderProjects(projects) {
  const container = document.getElementById('projects-container');
  if (!projects.length) {
    container.innerHTML = `<div class="empty">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <div style="margin-top:8px">No projects found</div>
      <div style="margin-top:4px;font-size:12px">Create your first project to get started</div>
    </div>`;
    return;
  }

  container.innerHTML = `<div class="projects-grid">${projects.map(p => {
    const start = p.startDate ? new Date(p.startDate).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' }) : null;
    const end = p.endDate ? new Date(p.endDate).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' }) : null;
    return `<a href="project-detail.html?id=${p.id}" class="project-card">
      <div class="project-card-header">
        <div>
          <div class="project-name">${p.name}</div>
          <div class="project-client">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ${p.clientName}
          </div>
        </div>
        ${statusBadge(p.status)}
      </div>
      ${p.description ? `<div style="font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${p.description}</div>` : ''}
      <div class="project-meta">
        <div class="project-value">${p.totalValue ? fmt(p.totalValue) : '—'}</div>
        ${start || end ? `<div style="font-size:11px;color:var(--muted)">${start || '?'} → ${end || 'Ongoing'}</div>` : ''}
      </div>
    </a>`;
  }).join('')}</div>`;
}

async function submitProject(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Creating…';
  btn.disabled = true;

  const body = {
    name: document.getElementById('f-name').value,
    clientName: document.getElementById('f-client').value,
    status: document.getElementById('f-status').value,
    totalValue: parseFloat(document.getElementById('f-value').value) || 0,
    startDate: document.getElementById('f-start').value || null,
    endDate: document.getElementById('f-end').value || null,
    description: document.getElementById('f-desc').value || null,
    notes: document.getElementById('f-notes').value || null,
  };

  const res = await fetch(`${API}/api/projects`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Session-ID': getSession() },
    body: JSON.stringify(body)
  });
  const data = await res.json();

  btn.textContent = 'Create Project';
  btn.disabled = false;

  if (data.success) {
    closeModal();
    toast('Project created!');
    await loadProjects();
  } else {
    toast(data.error || 'Failed to create project', 'error');
  }
}

async function loadProjects() {
  const res = await fetch(`${API}/api/projects`, { headers: { 'X-Session-ID': getSession() } });
  const data = await res.json();
  allProjects = data.projects || [];
  filterProjects();
}

async function loadClients() {
  const res = await fetch(`${API}/api/clients`, { headers: { 'X-Session-ID': getSession() } }).catch(() => null);
  if (!res) return;
  const clients = await res.json();
  const dl = document.getElementById('clients-list');
  (Array.isArray(clients) ? clients : []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    dl.appendChild(opt);
  });
}

async function init() {
  if (!getSession()) { location.href = 'login.html'; return; }
  const user = getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.fullName || user.username;
    document.getElementById('user-role').textContent = user.role;
    document.getElementById('avatar').textContent = (user.fullName || user.username || '?')[0].toUpperCase();
    if (user.role === 'admin') {
      document.getElementById('admin-section').style.display = '';
      document.getElementById('users-link').style.display = '';
    }
  }
  await Promise.all([loadProjects(), loadClients()]);
}

init();
</script>
</body>
