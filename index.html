<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G.R Automation — Login</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #273549;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --red: #ef4444;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* Background grid texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  /* Logo / brand */
  .brand-block {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(59,130,246,.35);
  }
  .brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .brand-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .card-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  /* Form */
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 7px;
  }
  .input-wrap {
    position: relative;
  }
  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: flex;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 11px 12px 11px 38px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  .form-input::placeholder { color: var(--muted); }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .form-input.error { border-color: var(--red); }

  /* Password toggle */
  .pw-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px;
    display: flex;
    transition: color .15s;
  }
  .pw-toggle:hover { color: var(--text); }

  /* Error alert */
  .alert {
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #fca5a5;
    margin-bottom: 18px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .alert.show { display: flex; }

  /* Submit button */
  .btn-login {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-login:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 4px 16px rgba(59,130,246,.4);
  }
  .btn-login:active:not(:disabled) { transform: scale(.99); }
  .btn-login:disabled { opacity: .65; cursor: not-allowed; }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer note */
  .footer-note {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand-block">
    <div class="brand-icon">
      <svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <div class="brand-name">A.G.R Automation</div>
    <div class="brand-sub">BOQ Management System</div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your account to continue</div>

    <div class="alert" id="error-alert">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="error-text">Invalid username or password</span>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input class="form-input" id="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input class="form-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()" tabindex="-1">
            <svg id="eye-show" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-hide" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-login" type="submit" id="login-btn">
        Sign In
      </button>
    </form>
  </div>

  <div class="footer-note">A.G.R Automation Pvt. Ltd. &copy; 2026</div>
</div>

<script>
const API = 'https://agr-boq-backend.agrayush98.workers.dev';

// Redirect if already logged in
if (localStorage.getItem('sessionId')) { location.href = 'dashboard.html'; }

function togglePw() {
  const inp = document.getElementById('password');
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  document.getElementById('eye-show').style.display = isHidden ? 'none' : '';
  document.getElementById('eye-hide').style.display = isHidden ? '' : 'none';
}

function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-alert').classList.add('show');
  document.getElementById('username').classList.add('error');
  document.getElementById('password').classList.add('error');
}

function clearError() {
  document.getElementById('error-alert').classList.remove('show');
  document.getElementById('username').classList.remove('error');
  document.getElementById('password').classList.remove('error');
}

async function handleLogin(e) {
  e.preventDefault();
  clearError();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Please enter your username and password.');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok || !data.sessionId) {
      showError(data.error || 'Invalid username or password.');
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
      return;
    }

    localStorage.setItem('sessionId', data.sessionId);
    localStorage.setItem('agr_user', JSON.stringify(data.user));

    btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Success!';
    btn.style.background = '#16a34a';

    setTimeout(() => { location.href = 'dashboard.html'; }, 400);

  } catch (err) {
    showError('Network error — please check your connection.');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

// Clear errors on input
document.getElementById('username').addEventListener('input', clearError);
document.getElementById('password').addEventListener('input', clearError);
</script>
</body>
</html>
