<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G.R Automation — Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #273549;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --orange: #f97316;
    --purple: #a855f7;
    --radius: 10px;
    --sidebar-w: 220px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* Sidebar */
  .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; transition: transform .25s; }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo .brand { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
  .sidebar-logo .tagline { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; padding: 14px 10px 6px; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all .15s; cursor: pointer; margin-bottom: 2px; }
  .nav-link:hover { background: var(--surface2); color: var(--text); }
  .nav-link.active { background: var(--accent); color: #fff; }
  .nav-link svg { flex-shrink: 0; opacity: .85; }
  .sidebar-footer { padding: 14px 8px; border-top: 1px solid var(--border); }
  .user-pill { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; }
  .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: 11px; color: var(--muted); }
  .logout-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 6px; transition: all .15s; }
  .logout-btn:hover { background: var(--surface2); color: var(--red); }

  /* Main */
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
  .menu-toggle { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; border-radius: 6px; }
  .topbar-title { font-size: 16px; font-weight: 600; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .content { padding: 24px; flex: 1; }

  /* Cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; gap: 16px; }
  .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-info .label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat-info .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .stat-info .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Table */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 14px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-draft { background: #1e293b; color: var(--muted); border: 1px solid var(--border); }
  .badge-sent { background: rgba(59,130,246,.15); color: #60a5fa; }
  .badge-accepted { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge-invoiced { background: rgba(168,85,247,.15); color: #c084fc; }
  .badge-rejected { background: rgba(239,68,68,.15); color: #f87171; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all .15s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  /* Empty state */
  .empty { padding: 48px; text-align: center; color: var(--muted); font-size: 14px; }

  /* Loading */
  .loading { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Overlay */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
  .overlay.open { display: flex; }

  /* BOQ panel flex layout */
  #boq-panel { display: none; }
  #boq-panel.open { display: flex !important; }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }
    .main { margin-left: 0; }
    .menu-toggle { display: block; }
    .topbar { padding: 12px 16px; }
    .content { padding: 16px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { padding: 14px; }
    .stat-info .value { font-size: 20px; }
    #boq-panel { left: 0 !important; }
    #boq-menu-toggle { display: flex !important; }
  }
  @media (max-width: 420px) {
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="brand">A.G.R Automation</div>
    <div class="tagline">BOQ Management System</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>
    <a href="dashboard.html" class="nav-link active">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="quotes.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Quotes
    </a>
    <a href="clients.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clients
    </a>
    <div class="nav-section">Work</div>
    <a class="nav-link" onclick="openBOQ()" style="cursor:pointer">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      BOQ System
    </a>
    <a href="projects.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Projects
    </a>
    <a href="analytics.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Analytics
    </a>
    <div class="nav-section" id="admin-section" style="display:none">Admin</div>
    <a href="users.html" class="nav-link" id="users-link" style="display:none">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Users
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</aside>

<!-- Mobile overlay -->
<div class="overlay" id="mob-overlay" onclick="closeSidebar()"></div>

<!-- BOQ iframe panel -->
<div id="boq-panel" style="display:none;position:fixed;top:0;left:var(--sidebar-w);right:0;bottom:0;z-index:90;background:var(--bg);flex-direction:column;">
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <button class="menu-toggle" onclick="toggleSidebar()" style="display:none" id="boq-menu-toggle">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span style="font-size:14px;font-weight:700">BOQ Generator</span>
    <button onclick="closeBOQ()" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s" onmouseover="this.style.background='var(--surface2)';this.style.color='var(--text)'" onmouseout="this.style.background='none';this.style.color='var(--muted)'">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <iframe id="boq-frame" src="" style="width:100%;flex:1;border:none;" allow="same-origin"></iframe>
</div>

<!-- Main -->
<div class="main">
  <header class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Dashboard</span>
    <div class="topbar-actions">
      <a href="quotes.html" class="btn btn-primary" style="font-size:12px;padding:7px 13px;">+ New Quote</a>
    </div>
  </header>

  <div class="content">
    <div class="stats-grid" id="stats">
      <div class="loading"><span class="spinner"></span>Loading stats…</div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Recent Quotes</span>
        <a href="quotes.html" class="btn btn-ghost" style="font-size:12px;padding:6px 12px;">View All</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Quote #</th>
              <th>Client</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="quotes-tbody">
            <tr><td colspan="5" class="loading"><span class="spinner"></span>Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://agr-boq-backend.agrayush98.workers.dev';

function getSession() { return localStorage.getItem('sessionId'); }
function getUser() { try { return JSON.parse(localStorage.getItem('agr_user') || 'null'); } catch { return null; } }

async function logout() {
  await fetch(`${API}/api/auth/logout`, { method: 'POST', headers: { 'X-Session-ID': getSession() } }).catch(() => {});
  localStorage.removeItem('sessionId');
  localStorage.removeItem('agr_user');
  location.href = 'login.html';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mob-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mob-overlay').classList.remove('open');
}

function openBOQ() {
  const panel = document.getElementById('boq-panel');
  const frame = document.getElementById('boq-frame');
  if (!frame.src || frame.src === 'about:blank') {
    frame.src = 'boq.html';
  }
  panel.classList.add('open');
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelector('.nav-link[onclick="openBOQ()"]').classList.add('active');
  closeSidebar();
}

function closeBOQ() {
  document.getElementById('boq-panel').classList.remove('open');
  document.querySelector('.nav-link[onclick="openBOQ()"]')?.classList.remove('active');
  document.querySelector('.nav-link[href="dashboard.html"]')?.classList.add('active');
}

function fmt(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }

function statusBadge(s) {
  const map = { draft: 'badge-draft', sent: 'badge-sent', accepted: 'badge-accepted', invoiced: 'badge-invoiced', rejected: 'badge-rejected' };
  return `<span class="badge ${map[s] || 'badge-draft'}">${s}</span>`;
}

async function loadStats(quotes) {
  const total = quotes.length;
  const revenue = quotes.reduce((s, q) => s + (q.grandTotal || 0), 0);
  const pending = quotes.filter(q => q.status === 'draft' || q.status === 'sent').length;
  const accepted = quotes.filter(q => q.status === 'accepted' || q.status === 'invoiced').length;

  const clients = await fetch(`${API}/api/clients`, { headers: { 'X-Session-ID': getSession() } }).then(r => r.json()).catch(() => []);
  const clientCount = Array.isArray(clients) ? clients.length : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(59,130,246,.15)">
        <svg width="20" height="20" fill="none" stroke="#60a5fa" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="stat-info"><div class="label">Total Quotes</div><div class="value">${total}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(34,197,94,.15)">
        <svg width="20" height="20" fill="none" stroke="#4ade80" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="stat-info"><div class="label">Total Revenue</div><div class="value" style="font-size:19px">${fmt(revenue)}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(234,179,8,.15)">
        <svg width="20" height="20" fill="none" stroke="#facc15" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-info"><div class="label">Pending</div><div class="value">${pending}</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(168,85,247,.15)">
        <svg width="20" height="20" fill="none" stroke="#c084fc" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="stat-info"><div class="label">Clients</div><div class="value">${clientCount}</div></div>
    </div>
  `;
}

async function init() {
  if (!getSession()) { location.href = 'login.html'; return; }
  const user = getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.fullName || user.username;
    document.getElementById('user-role').textContent = user.role;
    document.getElementById('avatar').textContent = (user.fullName || user.username || '?')[0].toUpperCase();
    if (user.role === 'admin') {
      document.getElementById('admin-section').style.display = '';
      document.getElementById('users-link').style.display = '';
    }
  }

  const data = await fetch(`${API}/api/quotes`, { headers: { 'X-Session-ID': getSession() } }).then(r => r.json()).catch(() => ({ quotes: [] }));
  const quotes = data.quotes || [];

  await loadStats(quotes);

  const recent = quotes.slice(0, 10);
  const tbody = document.getElementById('quotes-tbody');
  if (!recent.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No quotes yet</td></tr>';
    return;
  }
  tbody.innerHTML = recent.map(q => {
    const client = typeof q.client === 'object' ? q.client : JSON.parse(q.client || '{}');
    const date = new Date(q.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
    return `<tr>
      <td><span style="font-family:monospace;font-size:12px;color:var(--accent)">${q.quoteNumber}</span></td>
      <td>${client.name || '—'}</td>
      <td style="font-weight:600">${fmt(q.grandTotal)}</td>
      <td>${statusBadge(q.status)}</td>
      <td style="color:var(--muted)">${date}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
