<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G.R Automation — Clients</title>
<style>
  :root {
    --bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;
    --text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;
    --green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a855f7;
    --radius:10px;--sidebar-w:220px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}

  .sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
  .sidebar-logo .brand{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .sidebar-logo .tagline{font-size:11px;color:var(--muted);margin-top:2px}
  .sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
  .nav-section{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:14px 10px 6px}
  .nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:all .15s;margin-bottom:2px;cursor:pointer}
  .nav-link:hover{background:var(--surface2);color:var(--text)}
  .nav-link.active{background:var(--accent);color:#fff}
  .sidebar-footer{padding:14px 8px;border-top:1px solid var(--border)}
  .user-pill{display:flex;align-items:center;gap:10px;padding:9px 10px}
  .user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .user-info{flex:1;min-width:0}
  .user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-role{font-size:11px;color:var(--muted)}
  .logout-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;transition:all .15s}
  .logout-btn:hover{color:var(--red)}

  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
  .menu-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px;border-radius:6px}
  .topbar-title{font-size:16px;font-weight:600}
  .topbar-actions{margin-left:auto}
  .content{padding:24px;flex:1}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:180px}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px 9px 34px;font-size:13px;outline:none;transition:border-color .15s}
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--accent)}

  /* Client cards */
  .clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s}
  .client-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .client-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;margin-bottom:12px}
  .client-name{font-size:14px;font-weight:700;margin-bottom:4px}
  .client-loc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:12px}
  .client-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
  .client-stat .label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .client-stat .value{font-size:15px;font-weight:700;margin-top:2px}
  .contact-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}

  /* Drawer */
  .drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:flex-end}
  .drawer-bg.open{display:flex}
  .drawer{background:var(--surface);border-left:1px solid var(--border);width:100%;max-width:480px;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  .drawer-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10}
  .drawer-title{font-size:15px;font-weight:700}
  .drawer-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
  .drawer-close:hover{color:var(--text);background:var(--surface2)}
  .drawer-body{padding:20px;flex:1}
  .detail-section{margin-bottom:22px}
  .detail-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
  .detail-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
  .detail-row:last-child{border-bottom:none}
  .detail-row .label{color:var(--muted)}
  .detail-row .val{font-weight:500;text-align:right}
  .detail-row .val.bold{font-weight:700;font-size:14px;color:var(--accent)}

  /* Tier badge */
  .tier-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .tier-bronze{background:rgba(205,127,50,.12);color:#cd7f32}
  .tier-silver{background:rgba(148,163,184,.12);color:#94a3b8}
  .tier-gold{background:rgba(234,179,8,.12);color:#eab308}
  .tier-platinum{background:rgba(192,132,252,.12);color:#c084fc}

  .quotes-list{display:flex;flex-direction:column;gap:8px}
  .quote-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-draft{background:#1e293b;color:var(--muted);border:1px solid var(--border)}
  .badge-sent{background:rgba(59,130,246,.15);color:#60a5fa}
  .badge-accepted{background:rgba(34,197,94,.15);color:#4ade80}
  .badge-invoiced{background:rgba(168,85,247,.15);color:#c084fc}
  .badge-rejected{background:rgba(239,68,68,.15);color:#f87171}

  .empty{padding:56px;text-align:center;color:var(--muted);font-size:14px}
  .empty svg{opacity:.3;margin-bottom:12px}
  .loading{padding:40px;text-align:center;color:var(--muted);font-size:13px}
  .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .count-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--muted)}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
  .overlay.open{display:block}

  /* action buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)} .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.25)} .btn-danger:hover{background:rgba(239,68,68,.2)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .btn-block{width:100%;justify-content:center}

  /* edit form */
  .edit-form{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:10px}
  .field-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .field input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .field.full{grid-column:1/-1}
  .edit-msg{font-size:12px;padding:6px 0;text-align:center}

  @media(max-width:768px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.5)}
    .main{margin-left:0}
    .menu-toggle{display:block}
    .topbar{padding:12px 16px}
    .content{padding:16px}
    .clients-grid{grid-template-columns:1fr}
    .drawer{max-width:100%;border-left:none;border-top:1px solid var(--border);height:90vh;border-radius:14px 14px 0 0}
    .drawer-bg{align-items:flex-end}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="brand">A.G.R Automation</div>
    <div class="tagline">BOQ Management System</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>
    <a href="dashboard.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="quotes.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Quotes
    </a>
    <a href="clients.html" class="nav-link active">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clients
    </a>
    <div class="nav-section">Work</div>
    <a href="boq.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      BOQ System
    </a>
    <a href="projects.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Projects
    </a>
    <a href="analytics.html" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Analytics
    </a>
    <div class="nav-section" id="admin-section" style="display:none">Admin</div>
    <a href="users.html" class="nav-link" id="users-link" style="display:none">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Users
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Logout">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</aside>

<div class="overlay" id="mob-overlay" onclick="closeSidebar()"></div>

<div class="main">
  <header class="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Clients</span>
    <div class="topbar-actions">
      <span class="count-pill" id="count-pill">…</span>
    </div>
  </header>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search" placeholder="Search by name, city, state…" oninput="filterClients()">
      </div>
    </div>

    <div id="clients-container">
      <div class="loading"><span class="spinner"></span>Loading clients…</div>
    </div>
  </div>
</div>

<!-- Client detail drawer -->
<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer(event)">
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title" id="drawer-title">Client Detail</span>
      <button class="drawer-close" onclick="closeDrawerDirect()">×</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div class="loading"><span class="spinner"></span></div>
    </div>
  </div>
</div>

<script>
const API = 'https://agr-boq-backend.agrayush98.workers.dev';
let allClients = [];
let allQuotes = [];

function getSession() { return localStorage.getItem('sessionId'); }
function getUser() { try { return JSON.parse(localStorage.getItem('agr_user')||'null'); } catch { return null; } }

async function logout() {
  await fetch(`${API}/api/auth/logout`,{method:'POST',headers:{'X-Session-ID':getSession()}}).catch(()=>{});
  localStorage.clear(); location.href='login.html';
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mob-overlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mob-overlay').classList.remove('open'); }

function fmt(n) { return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }

function getTier(total) {
  if (total >= 2000000) return { label:'Platinum', cls:'tier-platinum', icon:'💎' };
  if (total >= 500000)  return { label:'Gold',     cls:'tier-gold',     icon:'🥇' };
  if (total >= 100000)  return { label:'Silver',   cls:'tier-silver',   icon:'🥈' };
  return { label:'Bronze', cls:'tier-bronze', icon:'🥉' };
}

function statusBadge(s) {
  const map={draft:'badge-draft',sent:'badge-sent',accepted:'badge-accepted',invoiced:'badge-invoiced',rejected:'badge-rejected'};
  return `<span class="badge ${map[s]||'badge-draft'}">${s}</span>`;
}

function getClientQuotes(clientName) {
  return allQuotes.filter(q => (q.client?.name||'') === clientName);
}

function filterClients() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allClients.filter(c =>
    !q || c.name.toLowerCase().includes(q) ||
    (c.city||'').toLowerCase().includes(q) ||
    (c.state||'').toLowerCase().includes(q) ||
    (c.contact||'').includes(q)
  );
  renderCards(filtered);
}

function renderCards(clients) {
  document.getElementById('count-pill').textContent = `${clients.length} clients`;
  const container = document.getElementById('clients-container');
  if (!clients.length) {
    container.innerHTML = `<div class="empty">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <div style="margin-top:8px">No clients found</div>
    </div>`;
    return;
  }

  container.innerHTML = `<div class="clients-grid">${clients.map(c => {
    const quotes = getClientQuotes(c.name);
    const total = quotes.reduce((s,q) => s+(q.grandTotal||0), 0);
    const tier = getTier(total);
    return `<div class="client-card" onclick="openDrawer('${c.name.replace(/'/g,"\\'")}')">
      <div class="client-avatar">${c.name[0].toUpperCase()}</div>
      <div class="client-name">${c.name}</div>
      <div class="client-loc">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${[c.city,c.state].filter(Boolean).join(', ')||'Location not set'}
      </div>
      ${c.contact ? `<div class="contact-row"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${c.contact}</div>` : ''}
      <div class="client-meta">
        <div class="client-stat">
          <div class="label">Quotes</div>
          <div class="value">${quotes.length}</div>
        </div>
        <div class="client-stat">
          <div class="label">Revenue</div>
          <div class="value" style="font-size:13px">${fmt(total)}</div>
        </div>
      </div>
      <div style="margin-top:10px">
        <span class="tier-badge ${tier.cls}">${tier.icon} ${tier.label}</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openDrawer(clientName) {
  const c = allClients.find(x => x.name === clientName);
  if (!c) return;
  document.getElementById('drawer-title').textContent = c.name;
  document.getElementById('drawer-bg').classList.add('open');

  const quotes = getClientQuotes(c.name);
  const total = quotes.reduce((s,q) => s+(q.grandTotal||0), 0);
  const tier = getTier(total);

  document.getElementById('drawer-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
      <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0">${c.name[0].toUpperCase()}</div>
      <div>
        <div style="font-size:18px;font-weight:700">${c.name}</div>
        <span class="tier-badge ${tier.cls}">${tier.icon} ${tier.label}</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Contact</div>
      <div class="detail-row"><span class="label">Phone</span><span class="val">${c.contact||'—'}</span></div>
      <div class="detail-row"><span class="label">Email</span><span class="val">${c.email||'—'}</span></div>
      <div class="detail-row"><span class="label">GSTIN</span><span class="val" style="font-family:monospace;font-size:12px">${c.gstin||'—'}</span></div>
      <div class="detail-row"><span class="label">City</span><span class="val">${c.city||'—'}</span></div>
      <div class="detail-row"><span class="label">State</span><span class="val">${c.state||'—'}</span></div>
      <div class="detail-row"><span class="label">Last Interaction</span><span class="val">${fmtDate(c.lastInteraction)}</span></div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Revenue Summary</div>
      <div class="detail-row"><span class="label">Total Quotes</span><span class="val">${quotes.length}</span></div>
      <div class="detail-row"><span class="label">Total Revenue</span><span class="val bold">${fmt(total)}</span></div>
      <div class="detail-row"><span class="label">Accepted</span><span class="val">${quotes.filter(q=>q.status==='accepted'||q.status==='invoiced').length}</span></div>
    </div>

    ${quotes.length ? `<div class="detail-section">
      <div class="detail-section-title">Quotes (${quotes.length})</div>
      <div class="quotes-list">
        ${quotes.map(q => `<div class="quote-item">
          <div>
            <div style="font-family:monospace;font-size:12px;color:var(--accent)">${q.quoteNumber}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtDate(q.createdAt)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:600;font-size:13px">${fmt(q.grandTotal)}</div>
            <div style="margin-top:3px">${statusBadge(q.status)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    ${c.notes ? `<div class="detail-section">
      <div class="detail-section-title">Notes</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6;white-space:pre-wrap">${c.notes}</div>
    </div>` : ''}

    <!-- Create new quote -->
    <div class="detail-section">
      <a href="boq.html?client=${encodeURIComponent(c.name)}&contact=${encodeURIComponent(c.contact||'')}&email=${encodeURIComponent(c.email||'')}" class="btn btn-primary btn-block">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create New Quote for ${c.name}
      </a>
    </div>

    <!-- Edit client -->
    <div class="detail-section">
      <button class="btn btn-ghost btn-block btn-sm" id="edit-toggle-btn" onclick="toggleEditForm(${c.id})">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit Client Details
      </button>
      <div id="edit-form-${c.id}" class="edit-form" style="display:none">
        <div class="field-group">
          <div class="field full">
            <label>Full Name</label>
            <input id="ef-name" value="${esc(c.name)}" placeholder="Client name">
          </div>
          <div class="field">
            <label>Phone</label>
            <input id="ef-contact" value="${esc(c.contact||'')}" placeholder="+91…">
          </div>
          <div class="field">
            <label>Email</label>
            <input id="ef-email" type="email" value="${esc(c.email||'')}" placeholder="email@…">
          </div>
          <div class="field">
            <label>GSTIN</label>
            <input id="ef-gstin" value="${esc(c.gstin||'')}" placeholder="22AAAAA0000A1Z5" style="font-family:monospace;font-size:12px">
          </div>
          <div class="field">
            <label>City</label>
            <input id="ef-city" value="${esc(c.city||'')}" placeholder="City">
          </div>
          <div class="field">
            <label>State</label>
            <input id="ef-state" value="${esc(c.state||'')}" placeholder="State">
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-primary btn-sm" style="flex:1" onclick="saveClient(${c.id})">Save Changes</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleEditForm(${c.id})">Cancel</button>
        </div>
        <div class="edit-msg" id="edit-msg-${c.id}"></div>
      </div>
    </div>
  `;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleEditForm(id) {
  const form = document.getElementById(`edit-form-${id}`);
  const btn  = document.getElementById('edit-toggle-btn');
  const open = form.style.display === 'none';
  form.style.display = open ? '' : 'none';
  if (btn) btn.style.display = open ? 'none' : '';
}

async function saveClient(id) {
  const msg = document.getElementById(`edit-msg-${id}`);
  msg.style.color = 'var(--muted)'; msg.textContent = 'Saving…';
  const payload = {
    name:    document.getElementById('ef-name')?.value.trim(),
    contact: document.getElementById('ef-contact')?.value.trim(),
    email:   document.getElementById('ef-email')?.value.trim(),
    gstin:   document.getElementById('ef-gstin')?.value.trim(),
    city:    document.getElementById('ef-city')?.value.trim(),
    state:   document.getElementById('ef-state')?.value.trim(),
  };
  if (!payload.name) { msg.style.color='var(--red)'; msg.textContent='Name is required'; return; }
  try {
    const r = await fetch(`${API}/api/clients/${id}`, {
      method:'PATCH',
      headers:{'X-Session-ID':getSession(),'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error||'Save failed');
    // Update local cache
    const idx = allClients.findIndex(c=>c.id===id);
    if (idx>=0) allClients[idx] = {...allClients[idx],...payload};
    msg.style.color = 'var(--green)'; msg.textContent = '✓ Saved successfully';
    // Refresh drawer title and cards
    document.getElementById('drawer-title').textContent = payload.name;
    filterClients();
  } catch(e) {
    msg.style.color = 'var(--red)'; msg.textContent = e.message;
  }
}

function closeDrawer(e) { if (e.target===document.getElementById('drawer-bg')) closeDrawerDirect(); }
function closeDrawerDirect() { document.getElementById('drawer-bg').classList.remove('open'); }

async function init() {
  if (!getSession()) { location.href='login.html'; return; }
  const user = getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.fullName||user.username;
    document.getElementById('user-role').textContent = user.role;
    document.getElementById('avatar').textContent = (user.fullName||user.username||'?')[0].toUpperCase();
    if (user.role==='admin') { document.getElementById('admin-section').style.display=''; document.getElementById('users-link').style.display=''; }
  }

  const [clientRes, quoteRes] = await Promise.all([
    fetch(`${API}/api/clients`,{headers:{'X-Session-ID':getSession()}}).then(r=>r.json()).catch(()=>[]),
    fetch(`${API}/api/quotes`, {headers:{'X-Session-ID':getSession()}}).then(r=>r.json()).catch(()=>({quotes:[]}))
  ]);

  allClients = Array.isArray(clientRes) ? clientRes : [];
  allQuotes  = (quoteRes.quotes||[]).map(q => ({
    ...q,
    client: typeof q.client==='string' ? JSON.parse(q.client||'{}') : (q.client||{})
  }));

  filterClients();
}

init();
</script>
</body>
</html>
